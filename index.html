  parts.push(new Uint8Array(lh.buffer),n8,d);const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,c,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,n8.length,true);ch.setUint32(42,off,true);cen.push(new Uint8Array(ch.buffer),n8);off+=30+n8.length+d.length}
 const cs=cen.reduce((s,x)=>s+x.length,0),en=new DataView(new ArrayBuffer(22));en.setUint32(0,0x06054b50,true);en.setUint16(8,files.length,true);en.setUint16(10,files.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);return new Blob([...parts,...cen,new Uint8Array(en.buffer)])}

 L.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='⌫')p=p.slice(0,-1);else if(k=='✓'){if(p.length<4)return draw('Ən azı 4 rəqəm');L.style.display='none';return res(p)}else if(k=='bio'||k=='x'){L.style.display='none';return res(k=='x'?null:'bio')}else if(p.length<6)p+=k;draw()})};draw(o.msg)})}

 try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Maliyyə'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'user',displayName:'İstifadəçi'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});S.set.bio=b64(c.rawId);save();render();toast('Barmaq izi aktivdir')}catch(e){toast('Alınmadı. Telefonda barmaq izi quraşdırılıb?')}}
async function unlock0(){let bad='';for(;;){const w=Date.now()<lockT,m=w?'Çox yanlış cəhd — '+Math.ceil((lockT-Date.now())/1000)+' san gözləyin':bad;
 const r=await pinPad('PIN daxil edin',{bio:!!S.set.bio,msg:m});if(r=='bio'){if(await bioAuth())return;bad='Barmaq izi alınmadı';continue}if(w)continue;
 const k=await dk(r,S.set.salt);try{await de(S.set.chk,k);KEY=k;fails=0;return}catch(e){bad='Yanlış PIN';if(++fails>=5){lockT=Date.now()+30000;fails=0}}}}

 if(!VD){try{VD=await Promise.all(S.vault.map(x=>de(x.e,KEY)))}catch(e){toast('Seyf açılmadı');return false}}return true}

 const a=await pinPad('Yeni PIN (4-6 rəqəm)',{cancel:1});if(!a)return;const b=await pinPad('PIN-i təkrar edin',{cancel:1});if(a!==b)return toast('PIN-lər uyğun gəlmir');
 const items=old?await Promise.all(S.vault.map(x=>de(x.e,old))):[],salt=b64(crypto.getRandomValues(new Uint8Array(16))),k=await dk(a,salt);
 S.vault=await Promise.all(items.map(async o=>({id:o.id,e:await en(o,k)})));S.set.salt=salt;S.set.chk=await en('ok',k);KEY=k;VD=items;save();render();toast('PIN təyin edildi')}

 if(S.vault.length)return toast('Əvvəl Seyf-dəki qeydləri silin');delete S.set.chk;delete S.set.salt;delete S.set.bio;KEY=VD=null;save();render()}
